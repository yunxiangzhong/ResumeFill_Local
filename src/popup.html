<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ResumeFill Local</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>ResumeFill Local</h1>
          <p class="repo-note">本地优先的中文网申简历填写助手。</p>
          <a class="repo-link" href="https://github.com/yunxiangzhong/ResumeFill_Local" target="_blank" rel="noopener">github.com/yunxiangzhong/ResumeFill_Local</a>
        </div>
        <button id="openOptions" class="ghost" type="button">设置</button>
      </header>

      <section class="panel">
        <button id="startAutofillBtn" type="button">开始填写</button>
        <button id="showProfilePanelBtn" class="secondary" type="button">打开资料面板</button>
        <button id="clearMarksBtn" class="ghost full" type="button">清除颜色标记</button>
      </section>

      <section class="panel muted">
        <div id="status">点击开始填写后会在页面右下角显示进度。绿色表示已填写，橙色表示待处理。</div>
      </section>

      <section class="panel">
        <h2>怎么用</h2>
        <p class="hint">在设置页维护本机资料。插件只使用本地规则，不联网、不上传简历，也不会自动提交申请。</p>
      </section>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
